{% extends "base.html" %}
{% block content %}
<section class="hero compact-hero">
  <div>
    <div class="eyebrow">Account settings</div>
    <h1>Profile</h1>
    <p>Update your personal details, profile picture, and password.</p>
  </div>
  <div class="avatar-wrap">
    {% if current_user.profile_picture %}
      <img class="avatar" src="{{ url_for('static', filename=current_user.profile_picture) }}" alt="Profile picture">
    {% else %}
      <div class="avatar avatar-fallback">{{ current_user.name[:1]|upper }}</div>
    {% endif %}
  </div>
</section>

<div class="grid-2">
  <section class="card">
    <div class="section-head"><h2>Update details</h2><span class="tip" title="These fields are used in group matching and your profile display.">i</span></div>
    
    <form method="post" enctype="multipart/form-data" class="form-grid">
      <label>Profile picture
        <input type="file" name="profile_picture" accept=".png,.jpg,.jpeg,.webp" title="Upload a profile picture">
      </label>
      <label>Name
        <input type="text" name="name" value="{{ current_user.name }}" required minlength="2" maxlength="80">
      </label>
      <label>Email
        <input type="email" name="email" value="{{ current_user.email }}" required maxlength="120">
      </label>
      <label>Program
        <input type="text" name="program" value="{{ current_user.program }}" maxlength="120" placeholder="Degree or study track">
      </label>
      <label>Location preference
        <input type="text" name="location_pref" value="{{ current_user.location_pref }}" maxlength="120" placeholder="Library / hostel / online">
      </label>
      <label>Availability
        <input type="text" name="availability" value="{{ current_user.availability }}" maxlength="255" placeholder="Mon evening, Wed night">
      </label>
      <label>Study goal
        <textarea name="study_goal" rows="4" maxlength="255" placeholder="What are you aiming for this term?">{{ current_user.study_goal }}</textarea>
      </label>
      <button type="submit">Save profile</button>
    </form>
  </section>

  <section class="card">
    <div class="section-head"><h2>Change password</h2><span class="tip" title="Use a password you have not reused elsewhere.">i</span></div>
    <form method="post" action="{{ url_for('change_password') }}" class="form-grid">
      <label>Current password
        <input type="password" name="current_password" required maxlength="128">
      </label>
      <label>New password
        <input type="password" name="new_password" required minlength="8" maxlength="128">
      </label>
      <label>Confirm password
        <input type="password" name="confirm_password" required minlength="8" maxlength="128">
      </label>
      <button type="submit">Update password</button>
    </form>
  </section>
</div>
{% endblock %}
