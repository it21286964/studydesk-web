{% extends "base.html" %}
{% block content %}
<div class="auth-shell">
  <section class="auth-card hero-auth">
    <div class="eyebrow">Welcome back</div>
    <h1>Sign in to StudyDesk</h1>
    <p class="muted">Keep your deadlines, study blocks, and group sessions aligned from one dashboard.</p>
    <form method="post" class="form-grid">
      <label>Email
        <input type="email" name="email" required maxlength="120" placeholder="name@example.com" title="Use the email linked to your StudyDesk account">
      </label>
      <label>Password
        <input type="password" name="password" required maxlength="128" placeholder="••••••••" title="Enter your account password">
      </label>
      <button type="submit">Login</button>
    </form>
    <p class="muted">No account yet? <a href="{{ url_for('register') }}">Create one</a></p>
  </section>
</div>
{% endblock %}
