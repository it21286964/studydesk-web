{% extends "base.html" %}
{% block content %}
<section class="card">
  <div class="section-head">
    <div>
      <div class="eyebrow">Module registry</div>
      <h1>Modules</h1>
    </div>
    <span class="tip" title="Every assignment, topic, exam, and group starts with a module.">i</span>
  </div>
  <div class="helper-grid">
    <div class="help-card"><strong>Credits</strong><p>Use the credit count from your syllabus. Higher-credit modules can be given more attention in planning.</p></div>
  </div>
  <form method="post" class="form-grid three-col">
    <label>Code
      <input type="text" name="code" required minlength="2" maxlength="20" pattern="[A-Za-z0-9][A-Za-z0-9\- ]{1,19}" placeholder="e.g. CS101" title="2 to 20 characters; letters, numbers, spaces, or hyphens">
    </label>
    <label>Name
      <input type="text" name="name" required minlength="2" maxlength="120" placeholder="e.g. Introduction to Computing">
    </label>
    <label>Credits
      <input type="number" name="credits" min="0" max="60" value="0" title="Credit weight used for prioritization">
    </label>
    <button type="submit">Add module</button>
  </form>
</section>

<div class="toolbar">
  <input type="search" class="searchbox" placeholder="Filter modules…" data-live-filter=".module-card" title="Search your module list">
</div>

<div class="grid">
  {% for m in modules %}
  <div class="card module-card">
    <div class="section-head">
      <h3>{{ m.code }}</h3>
      <span class="pill">{{ m.credits }} cr</span>
    </div>
    <p>{{ m.name }}</p>
    <form method="post" action="{{ url_for('delete_module', module_id=m.id) }}">
      <button class="danger" type="submit" title="Remove this module and its linked records">Delete</button>
    </form>
  </div>
  {% endfor %}
</div>
{% endblock %}
